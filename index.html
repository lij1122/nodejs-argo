<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DevBlog Pro - Card Edition</title>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Highlight -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar{
  width:320px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:14px;
  overflow-y:auto;
}

.brand{
  font-size:18px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:14px;
}

.card{
  background:#0f1620;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card .info{
  padding:10px;
}

.card .title{
  font-size:14px;
  font-weight:600;
}

.card .tag{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* Content */
.content{
  flex:1;
  padding:24px;
  overflow-y:auto;
}

.article{
  max-width:900px;
  margin:0 auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:22px;
}

.hero{
  width:100%;
  border-radius:12px;
  margin-bottom:16px;
  border:1px solid var(--border);
}

pre{
  background:#0b0f14;
  padding:12px;
  border-radius:10px;
  overflow:auto;
}

code{font-family:Consolas,monospace}

h1,h2,h3{color:var(--accent)}

blockquote{
  border-left:3px solid var(--accent);
  padding-left:10px;
  color:var(--muted);
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="brand">DevBlog Pro</div>

  <div class="card" onclick="openPost(0)">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" />
    <div class="info">
      <div class="title">JavaScript Async Model</div>
      <div class="tag">JavaScript · Event Loop</div>
    </div>
  </div>

  <div class="card" onclick="openPost(1)">
    <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800" />
    <div class="info">
      <div class="title">HTTP vs TCP Explained</div>
      <div class="tag">Network · Protocols</div>
    </div>
  </div>

  <div class="card" onclick="openPost(2)">
    <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=800" />
    <div class="info">
      <div class="title">Frontend Performance</div>
      <div class="tag">Web · Optimization</div>
    </div>
  </div>

  <div class="card" onclick="openPost(3)">
    <img src="https://images.unsplash.com/photo-1518779578993-ec3579fee39f?w=800" />
    <div class="info">
      <div class="title">Browser Rendering Pipeline</div>
      <div class="tag">Browser · Internals</div>
    </div>
  </div>
</div>

<!-- Content -->
<div class="content">
  <div class="article" id="app">Loading...</div>
</div>

<script>

const posts = [
{
title:"JavaScript Async Model",
img:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200",
md:`
# JavaScript Async Model

JavaScript is **single-threaded**, but uses an event-driven model.

![async](https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1200)

## Core Concepts

- Call Stack
- Microtasks
- Macrotasks

## Example

\`\`\`js
console.log("Start");

setTimeout(() => console.log("Timeout"), 0);

Promise.resolve().then(() => console.log("Promise"));

console.log("End");
\`\`\`

> Output order: Start → End → Promise → Timeout
`
},

{
title:"HTTP vs TCP Explained",
img:"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200",
md:`
# HTTP vs TCP

## TCP

- Reliable connection
- Three-way handshake
- Transport layer protocol

![network](https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200)

## HTTP

- Application layer
- Built on TCP

\`\`\`
Client → HTTP → TCP → IP → Network
\`\`\`
`
},

{
title:"Frontend Performance",
img:"https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=1200",
md:`
# Frontend Performance

## Optimization Techniques

- Lazy loading images
- Code splitting
- CDN usage
- Reduce reflows

![performance](https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1200)

\`\`\`js
window.addEventListener('scroll', throttle(() => {
  console.log("scroll");
}, 200));
\`\`\`
`
},

{
title:"Browser Rendering Pipeline",
img:"https://images.unsplash.com/photo-1518779578993-ec3579fee39f?w=1200",
md:`
# Browser Rendering Pipeline

## Steps

1. HTML Parsing
2. DOM Construction
3. CSSOM Creation
4. Render Tree
5. Layout
6. Paint
7. Composite

![render](https://images.unsplash.com/photo-1542831371-29b0f74f9713?w=1200)

> Reflow is expensive and should be minimized.
`
}
];

function openPost(i){
  const p = posts[i];

  document.getElementById("app").innerHTML = `
    <img class="hero" src="${p.img}" />
    ${marked.parse(p.md)}
  `;

  document.querySelectorAll("pre code").forEach(el=>{
    hljs.highlightElement(el);
  });
}

openPost(0);

</script>

</body>
</html>
